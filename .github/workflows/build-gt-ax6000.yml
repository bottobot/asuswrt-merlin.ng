name: build-gt-ax6000

# Builds GT-AX6000 firmware from this branch in gnuton's Merlin toolchain container.
# Recipe: RMerl tools/build-all (SDK src-rt-5.04axhnd.675x, `make gt-ax6000`) + gnuton's CI layout.
on:
  workflow_dispatch:
  push:
    branches: [ap-stripdown]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      # Pinned by digest: this was the `latest` tag on 2026-10-28 (the image used by the first green build). Bump by hand.
      image: gnuton/asuswrt-merlin-toolchains-docker@sha256:8c9681987352d6eb8a38708126c9c39edd8dd28a7bf6c0cedc0e9534387f9ab3
      # The image's default user is `docker`. As that user the runner's per-step
      # files under /__w/_temp/_runner_file_commands are unwritable, so
      # upload-artifact's set_output fails (EACCES) after the upload succeeded.
      # Run the container as root and drop to docker only for the clone and
      # the build, because the SDK's prebuild_checks refuses to build as root.
      options: --user root
      volumes:
        - /mnt:/project   # the runner's /mnt disk is much larger than /
    env:
      SDK_DIR: /project/src/release/src-rt-5.04axhnd.675x
    steps:
      - name: Disk and toolchain check
        run: |
          df -h / /project
          ls /home/docker/am-toolchains/brcm-arm-hnd/ | grep -i 9.2
      - name: Clone this branch
        run: |
          chown docker /project
          sudo -u docker -H git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY.git" /project/src
      - name: Build
        id: build
        shell: bash
        env:
          MERLINUPDATE: y   # matches the official release build; see docs/baseline-3006.102.9-ci-vs-official.md
        run: |
          sudo -u docker -H env SDK_DIR="$SDK_DIR" MERLINUPDATE="$MERLINUPDATE" bash -c '
            source /home/docker/envs/bcm-hnd-ax-4.19.sh
            cd "$SDK_DIR"
            make gt-ax6000 > /project/build.log 2>&1 || { tail -n 200 /project/build.log; exit 1; }
            tail -n 30 /project/build.log
            df -h /project
          '
      - name: Collect image
        if: success()
        run: |
          mkdir -p /project/out
          cp "$SDK_DIR"/image/*_nand_squashfs.pkgtb /project/out/
          cd /project/out && sha256sum * > sha256sums.txt && cat sha256sums.txt && ls -l
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gt-ax6000-${{ github.sha }}
          path: /project/out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.sha }}
          path: /project/build.log
          if-no-files-found: ignore
      - name: Verify firmware artifact was uploaded
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$BUILD_OUTCOME" = success ] || { echo "build did not succeed ($BUILD_OUTCOME); nothing to verify"; exit 0; }
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | tee /tmp/artifacts.json | grep '"name"'
          grep -q "\"name\": *\"gt-ax6000-$GITHUB_SHA\"" /tmp/artifacts.json || { echo "artifact gt-ax6000-$GITHUB_SHA missing"; exit 1; }
